name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install build tools
        run: |
          brew install cmake ninja xcodegen
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"

      - name: Check iOS build prerequisites
        run: |
          echo "Checking iOS preset..."
          cmake --list-presets
          echo "Checking iOS packaging script..."
          test -f scripts/build/ios/package-ios-zh.sh
          echo "Prerequisite check complete."
