name: iOS Engine Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install cmake ninja meson xcodegen glslang

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_VERSION="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt)"
          echo "Installing Vulkan SDK ${SDK_VERSION}"

          curl -fL \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkan_sdk.zip?Human=true" \
            -o "$RUNNER_TEMP/vulkan_sdk.zip"

          mkdir -p "$RUNNER_TEMP/vulkan-sdk-installer"
          cd "$RUNNER_TEMP/vulkan-sdk-installer"
          unzip -q "$RUNNER_TEMP/vulkan_sdk.zip"

          APP="$(find . -type d -name '*.app' -print -quit)"
          test -n "$APP"

          INSTALLER="$APP/Contents/MacOS/$(basename "$APP" .app)"
          SDK_ROOT="$HOME/VulkanSDK/$SDK_VERSION"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command install \
            com.lunarg.vulkan.core \
            com.lunarg.vulkan.ios \
            copy_only=1

          echo "VULKAN_SDK=$SDK_ROOT/macOS" >> "$GITHUB_ENV"

          test -f "$SDK_ROOT/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Prepare iOS dependencies
        run: |
          git submodule update --init references/fbraz3-dxvk
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS
        run: |
          cmake --preset ios-vulkan

      - name: Build engine
        run: |
          cmake --build build/ios-vulkan --target z_generals --parallel 3

      - name: Locate iOS app outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-output"

          find build/ios-vulkan -type d -name '*.app' -print
          find build/ios-vulkan -type f -name '*.ipa' -print

          APP_PATH="$(find build/ios-vulkan -type d -name '*.app' -print -quit)"
          IPA_PATH="$(find build/ios-vulkan -type f -name '*.ipa' -print -quit)"

          if [[ -n "$APP_PATH" ]]; then
            ditto "$APP_PATH" "$RUNNER_TEMP/ios-output/$(basename "$APP_PATH")"
          fi

          if [[ -n "$IPA_PATH" ]]; then
            cp "$IPA_PATH" "$RUNNER_TEMP/ios-output/"
          fi

          if [[ -z "$APP_PATH" && -z "$IPA_PATH" ]]; then
            echo "No .app or .ipa output found. Inspecting build outputs:"
            find build/ios-vulkan -maxdepth 6 -type d -name '*.app' -o -type f -name '*.ipa'
            exit 1
          fi

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: Generals-iOS-build
          path: ${{ runner.temp }}/ios-output/*
          if-no-files-found: error
          retention-days: 7
