name: iOS Engine Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install cmake ninja meson xcodegen

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_VERSION="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt)"
          echo "Installing Vulkan SDK ${SDK_VERSION}"

          curl -fL \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkan_sdk.zip?Human=true" \
            -o "$RUNNER_TEMP/vulkan_sdk.zip"

          mkdir -p "$RUNNER_TEMP/vulkan-sdk-installer"
          cd "$RUNNER_TEMP/vulkan-sdk-installer"
          unzip -q "$RUNNER_TEMP/vulkan_sdk.zip"

          APP="$(find . -type d -name '*.app' -print -quit)"
          test -n "$APP"

          INSTALLER="$APP/Contents/MacOS/$(basename "$APP" .app)"
          SDK_ROOT="$HOME/VulkanSDK/$SDK_VERSION"

          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command install \
            com.lunarg.vulkan.core \
            com.lunarg.vulkan.ios \
            copy_only=1

          echo "VULKAN_SDK=$SDK_ROOT/macOS" >> "$GITHUB_ENV"

          test -f "$SDK_ROOT/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Prepare iOS dependencies
        run: |
          git submodule update --init references/fbraz3-dxvk
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS
        run: |
          cmake --preset ios-vulkan

      - name: Build engine
        run: |
          cmake --build build/ios-vulkan --target z_generals --parallel 3
