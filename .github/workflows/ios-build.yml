name: iOS Engine Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Check iOS preset
        run: |
          cmake --list-presets
          cmake --preset ios-vulkan
