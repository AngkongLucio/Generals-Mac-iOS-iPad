name: Build & Push .ipa

on:
push:
branches:
- main # Run on pushes to main (adjust if you use a different branch)
workflow_dispatch: # Allows you to trigger manually from the Actions tab

env:
APP_NAME: <YOUR_APP_NAME> # e.g., MyApp
TARGET_NAME: <YOUR_TARGET> # e.g., MyApp
CODE_SIGN_IDENTITY: "Apple Distribution"
PROVISIONING_PROFILE_SPECIFIER: "MyApp Distribution" # exact name from Apple Developer portal
GITHUB_PAT: ${{ secrets.GITHUB_PAT }} # PAT stored as a repository secret

jobs:
build:
name: Build .ipa
runs-on: macos-14 # macOS 14 “Sonoma”; change to macos-13 if you prefer
steps:
- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Ruby (needed for fastlane if you use it)
uses: ruby/setup-ruby@v1
with:
ruby-version: 3.2

- name: Install Fastlane (optional, but handy for signing)
run: gem install fastlane

# ----------
# 1. Build the .ipa
# ----------
- name: Build .ipa
env:
# Pass the PAT into the build script via an environment variable
GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
run: |
echo "=== Building archive ==="
xcodebuild clean -project $APP_NAME.xcodeproj -scheme $TARGET_NAME -configuration Release
xcodebuild archive \
-project $APP_NAME.xcodeproj \
-scheme $TARGET_NAME \
-configuration Release \
-archivePath ./build/$APP_NAME.xcarchive \
CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
OTHER_CODE_SIGN_FLAGS="--force"

echo "=== Exporting .ipa ==="
xcodebuild -exportArchive \
-archivePath ./build/$APP_NAME.xcarchive \
-exportPath ./build/exports \
-exportOptionsPlist <<END
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
"http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
<key>method</key> <string>app-store</string>
<key>signingStyle</key> <string>manual</string>
<key>signingCertificate</key> <string>$CODE_SIGN_IDENTITY</string>
<key>provisioningProfiles</key>
<dict>
<key>$TARGET_NAME</key> <string>$PROVISIONING_PROFILE_SPECIFIER</string>
</dict>
<key>stripSwiftSymbols</key> <true/>
<key>compileBitcode</key> <false/>
</dict>
</plist>
END

echo "=== .ipa path ==="
ls -l ./build/exports/*.ipa

# ----------
# 2. Commit the .ipa to the repo
# ----------
- name: Commit .ipa
run: |
# Move the ipa to a place that can be added to git
mkdir -p ipa-builds
cp ./build/exports/*.ipa ipa-builds/
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add ipa-builds/*.ipa
git commit -m "Add build $(date +'%Y-%m-%d_%H-%M-%S')" || echo "No changes to commit"
git push https://$GITHUB_PAT@github.com/${{ github.repository }}.git

# ----------
# 3. (Optional) Create a Release with the .ipa attached
# ----------
- name: Create Release
if: github.ref == 'refs/heads/main' # only on main branch pushes
uses: softprops/action-gh-release@v2
