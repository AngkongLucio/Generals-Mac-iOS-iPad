name: iOS Engine Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install cmake ninja meson xcodegen glslang

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_VERSION="$(curl -fsSL https://vulkan.lunarg.com/sdk/latest/mac.txt)"
          curl -fL "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/mac/vulkan_sdk.zip?Human=true" -o "$RUNNER_TEMP/vulkan_sdk.zip"
          mkdir -p "$RUNNER_TEMP/vulkan-sdk-installer"
          cd "$RUNNER_TEMP/vulkan-sdk-installer"
          unzip -q "$RUNNER_TEMP/vulkan_sdk.zip"
          APP="$(find . -type d -name '*.app' -print -quit)"
          test -n "$APP"
          INSTALLER="$APP/Contents/MacOS/$(basename "$APP" .app)"
          SDK_ROOT="$HOME/VulkanSDK/$SDK_VERSION"
          "$INSTALLER" \
            --root "$SDK_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command install \
            com.lunarg.vulkan.core \
            com.lunarg.vulkan.ios \
            copy_only=1
          echo "VULKAN_SDK=$SDK_ROOT/macOS" >> "$GITHUB_ENV"
          test -f "$SDK_ROOT/macOS/lib/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"

      - name: Prepare iOS dependencies
        run: |
          git submodule update --init references/fbraz3-dxvk
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure iOS
        run: cmake --preset ios-vulkan

      - name: Build engine
        run: cmake --build build/ios-vulkan --target z_generals --parallel 3

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find build/ios-vulkan -type d -name 'GeneralsXZH.app' -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            APP_PATH="$(find build/ios-vulkan -type d -name '*.app' -print -quit)"
          fi

          if [[ -z "$APP_PATH" ]]; then
            echo "ERROR: No iOS .app bundle found."
            find build/ios-vulkan -maxdepth 7 -type f -name 'GeneralsXZH' -print
            exit 1
          fi

          if [[ ! -f "$APP_PATH/GeneralsXZH" ]]; then
            echo "ERROR: GeneralsXZH executable missing from $APP_PATH"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/$(basename "$APP_PATH")"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/GeneralsXZH.ipa" Payload

          test -s "$RUNNER_TEMP/GeneralsXZH.ipa"
          echo "Created $RUNNER_TEMP/GeneralsXZH.ipa"
          unzip -l "$RUNNER_TEMP/GeneralsXZH.ipa" | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-IPA
          path: ${{ runner.temp }}/GeneralsXZH.ipa
          if-no-files-found: error
          retention-days: 7
        with:
          name: Generals-iOS-build
          path: ${{ runner.temp }}/ios-output/*
          if-no-files-found: error
          retention-days: 7
